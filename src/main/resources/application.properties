spring.application.name=company-management
server.port =9910

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres.railway.internal:5432/railway}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:VeMBZesjgsiUeRzFcHyEigCOabeCGkVL}
iam_service_base_url=${AUTH_SERVICE_BASE_URL:http://localhost:7077/iamcontroller}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

defaultTenant=tomato
tenant.config.api.url=${TENANT_DB_URL:https://tenant-management-production-d2a8.up.railway.app/api/v1/tenants/databases}
tenant_management_base_url=${TENANT_MANAGEMENT:https://tenant-management-production-d2a8.up.railway.app}
spring.jpa.properties.hibernate.show_sql=true


# Redis (groups cache). Short timeouts so we fall back to the DB quickly if Redis is down.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
groups.cache.enabled=${GROUPS_CACHE_ENABLED:true}
groups.cache.ttl-hours=${GROUPS_CACHE_TTL_HOURS:12}


# Notices
notices.scheduler.enabled=${NOTICES_SCHEDULER_ENABLED:true}
# Daily at 01:00 IST (Spring cron: sec min hour day month weekday).
notices.scheduler.cron=${NOTICES_SCHEDULER_CRON:0 0 1 * * *}
notices.scheduler.zone=${NOTICES_SCHEDULER_ZONE:Asia/Kolkata}
