# In-memory H2 for repository / API tests. Hibernate creates the schema only here; production keeps ddl-auto=none.
spring.datasource.url=jdbc:h2:mem:notices;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false

notices.scheduler.enabled=false
